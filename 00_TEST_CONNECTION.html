<!doctype html>
<html lang="zh-Hans">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoadTrip Connection Test</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;padding:24px;color:#111827}
.box{max-width:700px;margin:auto;background:white;padding:22px;border:1px solid #e5e7eb;border-radius:20px}
.ok{background:#f0fdf4;color:#166534;padding:12px;border-radius:12px}.err{background:#fef2f2;color:#991b1b;padding:12px;border-radius:12px}
code{word-break:break-all}button{padding:10px 14px;border:0;background:#111827;color:white;border-radius:12px}
</style></head>
<body><div class="box">
<h2>🔌 RoadTrip Supabase Connection Test</h2>
<p id="cfg"></p><button id="test">Test Connection</button><div id="out" style="margin-top:12px"></div>
</div>
<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.ROADTRIP_CONFIG||{};
const mask=s=>!s?'(empty)':(s.length<12?s:s.slice(0,8)+'…'+s.slice(-6));
document.getElementById('cfg').innerHTML =
  'URL: <code>'+mask(cfg.SUPABASE_URL)+'</code><br>Key: <code>'+mask(cfg.SUPABASE_KEY)+'</code>';
document.getElementById('test').onclick=async()=>{
 const out=document.getElementById('out');
 if(!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('PASTE_') || !cfg.SUPABASE_KEY || cfg.SUPABASE_KEY.includes('PASTE_')){
   out.innerHTML='<div class="err">config.js 还没填好。</div>'; return;
 }
 try{
   const sb=createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);
   const {data,error}=await sb.auth.getSession();
   if(error) throw error;
   out.innerHTML='<div class="ok">✅ Connection OK！Supabase URL + Publishable key 正常。现在可以打开 index.html。</div>';
 }catch(e){
   out.innerHTML='<div class="err">❌ '+String(e.message||e)+'</div>';
 }
};
</script></body></html>
